<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="favicon" rel="icon" type="image/png" href="/logo-192.png" />
    <script>
      const favicon = document.getElementById('favicon');
      const matcher = window.matchMedia('(prefers-color-scheme: dark)');
      const updateFavicon = () => {
        favicon.href = matcher.matches ? '/logo-192.png' : '/logo1-192.png';
      };
      matcher.addEventListener('change', updateFavicon);
      updateFavicon();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jagga Digital — We craft stunning digital experiences that convert. Web design, product strategy, custom development, and interface design." />
    <meta name="keywords" content="digital agency, web design, product strategy, custom development, UI/UX design" />

    <title>Jagga Digital — Premium Digital Experiences</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
