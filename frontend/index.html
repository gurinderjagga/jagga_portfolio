<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Jagga Digital | Premium Digital Experiences</title>
    <meta name="description" content="Jagga Digital. We craft stunning digital experiences that convert. Web design, product strategy, custom development, and interface design." />
    <link rel="canonical" href="https://jaggadigital.vercel.app/" />

    <!-- Icons -->
    <link id="favicon" rel="icon" type="image/png" href="/logo-192.png" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <script>
      const favicon = document.getElementById('favicon');
      const matcher = window.matchMedia('(prefers-color-scheme: dark)');
      const updateFavicon = () => {
        favicon.href = matcher.matches ? '/logo-192.png' : '/logo1-192.png';
      };
      matcher.addEventListener('change', updateFavicon);
      updateFavicon();
    </script>

    <!-- Browser chrome, matching the two themes in index.css -->
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0F1D" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph: what LinkedIn, Slack, WhatsApp and iMessage render -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jagga Digital" />
    <meta property="og:url" content="https://jaggadigital.vercel.app/" />
    <meta property="og:title" content="Jagga Digital | Premium Digital Experiences" />

    <meta property="og:image:alt" content="Jagga Digital. Your Vision. Our Code. Measurable Results." />
